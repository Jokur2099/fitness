function makePlan(p){let pool=allowed(p),names=pattern(p);let start=new Date();start.setHours(12,0,0,0);const monday=new Date(start);monday.setDate(start.getDate()-((start.getDay()+6)%7));let sessions=[];for(let w=0;w<4;w++)p.days.slice().sort((a,b)=>a-b).forEach((day,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+w*7+day);if(d<start)d.setDate(d.getDate()+28);let name=names[i%names.length],groups=name.startsWith('Верх')?['push','pull','shoulder','arms']:name.startsWith('Низ')?['squat','hinge','core']:i%2?['hinge','pull','squat','push','core']:['squat','push','hinge','pull','core'];let exercises=[];for(let g of groups){let options=pool.filter(e=>e.group===g);if(options.length){let preferred=options.filter(e=>p.level!=='beginner'||!['backsquat','pullup','brdl'].includes(e.id));let list=preferred.length?preferred:options;let known=list.find(e=>num(p.known[e.id])>0);let e=known||list[(i%2)%list.length];exercises.push(makeExercise(e,p,name.includes('лёгкая')))}}const estimate=()=>5+exercises.reduce((n,e)=>n+1+e.sets*(40+e.rest)/60,0);while(estimate()>p.duration&&exercises.some(e=>e.sets>1)){let max=Math.max(...exercises.map(e=>e.sets));exercises.slice().reverse().find(e=>e.sets===max).sets--}while(estimate()>p.duration&&exercises.length>2)exercises.pop();sessions.push({id:uid(),date:dateKey(d),week:w,name,exercises,status:'planned'})});sessions.sort((a,b)=>a.date.localeCompare(b.date));sessions.forEach(s=>s.week=Math.floor((parseDate(s.date)-start)/86400000/7));return{id:uid(),created:dateKey(start),reason:(p.frequency<=3?'Тренировки всего тела распределяют нагрузку по неделе и дают регулярную практику основных движений.':'Чередование верха и низа распределяет нагрузку между мышечными группами. Дополнительные занятия облегчены.')+' Объём подобран под доступное время с учётом отдыха и разминки. Для коротких занятий число подходов уменьшено.',sessions}}
function currentSession(){return state.plan?.sessions.find(s=>s.status==='planned')}
function getLoad(ex){let r=state.rules[ex.id];return r?{...ex,weight:r.weight,sets:r.sets??ex.sets,confirmed:r.confirmed??ex.confirmed}:clone(ex)}
function equipmentStep(id){const e=DB.find(e=>e.id===id);let key=['barbell','dumbbell','cable'].find(k=>e.eq.includes(k));return state.profile.steps[key]||state.profile.otherStep||1}
function progression(ex,sets,previous){const valid=sets.filter(s=>s.weight!==''&&s.reps!==''&&s.rir!==''&&Number.isFinite(+s.weight)&&Number.isFinite(+s.reps)&&Number.isFinite(+s.rir));let base={weight:ex.weight,sets:ex.sets,confirmed:ex.confirmed,streak:previous?.streak||0,blocked:previous?.blocked||false,reason:''};if(sets.some(s=>s.pain))return{...base,blocked:true,reason:'Отмечена боль. Прекратите болезненное движение. Автоповышение заблокировано до ручной проверки в настройках упражнения.'};if(base.blocked)return{...base,reason:'Автоповышение заблокировано из-за ранее отмеченной боли. Проверьте движение и снимите блокировку вручную только после решения проблемы.'};if(valid.length!==ex.sets)return{...base,reason:`Заполнено ${valid.length} из ${ex.sets} рабочих подходов. Для решения нужны вес, повторения и RIR во всех подходах. Нагрузка сохранена.`};const e=DB.find(e=>e.id===ex.id);let same=valid.every(s=>Math.abs(s.weight-valid[0].weight)<.001);if(!same)return{...base,reason:'Рабочие веса в подходах различаются. Нагрузка сохранена: задайте единый ориентир вручную для следующей тренировки.'};let weight=valid[0].weight;let out={...base,weight,confirmed:true};if(valid.some(s=>s.technique))return{...out,reason:'Отмечено нарушение техники. Сохраните или уменьшите нагрузку, сначала восстановите контроль движения.'};if(!e.body&&weight===0)return{...out,confirmed:false,reason:'Укажите фактический рабочий вес после калибровки. Автоповышение пока недоступно.'};let low=valid.some(s=>s.reps<ex.low),streak=low?base.streak+1:0;if(low&&streak>=2){if(e.body)return{...out,streak,sets:Math.max(1,ex.sets-1),reason:'Две заполненные тренировки подряд ниже диапазона. Предлагаем на один подход меньше (минимум один) и более лёгкую вариацию при необходимости.'};const step=equipmentStep(ex.id);return{...out,streak,weight:Math.max(0,+(weight-step).toFixed(4)),reason:`Две заполненные тренировки подряд ниже диапазона. Предлагаем уменьшить вес на один шаг: ${displayWeight(weight)} → ${displayWeight(Math.max(0,weight-step))} ${unit()}.`}}if(low)return{...out,streak,reason:'Впервые не достигнута нижняя граница. Повторите эту нагрузку с учётом самочувствия; увеличения нет.'};if(valid.every(s=>s.reps>=ex.high&&s.rir>=2)){if(e.body){if(ex.high<20)return{...out,streak:0,reason:`Все подходы достигли верхней границы с RIR ≥ 2. Добавляйте повторения вручную до 20; при достижении 20 можно добавить один подход.`,nextLow:ex.low,nextHigh:Math.min(20,ex.high+2)};if(ex.sets<4)return{...out,streak:0,sets:ex.sets+1,reason:'Достигнуты 20 повторений с запасом. Предлагаем добавить один подход, максимум четыре. Сложность движения сохраняется.'};return{...out,streak:0,reason:'Достигнуты 4 подхода по 20. Подберите более сложную вариацию вручную; новая вариация начнёт отдельную историю.'}}const next=+(weight+equipmentStep(ex.id)).toFixed(4);return{...out,streak:0,weight:next,reason:`Выполнены все ${ex.sets} подхода по ${ex.high} или больше с запасом ≥ 2. Предлагаем увеличить вес с ${displayWeight(weight)} до ${displayWeight(next)} ${unit()} и начать с ${ex.low} повторений.`}}return{...out,streak:0,reason:valid.some(s=>s.rir<2)?'Запас менее двух повторений. Сохраните вес; избегайте постоянной работы до отказа.':'Вес сохранён. Постепенно наращивайте повторения до верхней границы во всех подходах.'}}
function resolved(ex){let out=getLoad(ex),r=state.rules[ex.id];if(r?.nextLow)out.low=r.nextLow;if(r?.nextHigh)out.high=r.nextHigh;return out}
function icon(i){return ['◫','▦','↗','○'][i]}
function render(){if(!state.profile){renderOnboarding();return}$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo"><i></i><i></i><i></i></span>ритм<span style="color:var(--lime)">.</span></div><nav class="nav" aria-label="Основная навигация">${['Сегодня','План','Прогресс','Профиль'].map((t,i)=>`<button data-nav="${['today','plan','history','profile'][i]}" class="${page===['today','plan','history','profile'][i]?'active':''}"><span class="icon" aria-hidden="true">${icon(i)}</span>${t}</button>`).join('')}</nav><div class="side-note">Твой темп.<br>Твоя сильная сторона.<div class="space">● Все данные на устройстве</div></div></aside><main class="content"><div class="topbar"><div class="eyebrow">СИЛА В ПОСТОЯНСТВЕ</div><div class="row"><span class="pill" id="offline-status">${location.protocol==='file:'?'Локальная страница':'Локальные данные'}</span><div class="avatar">${esc(state.profile.name.charAt(0).toUpperCase())}</div></div></div><div id="view"></div><footer>Ритм · Локальный дневник силовых тренировок<br>Данные вводятся вручную. Apple Health не подключён.</footer></main></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render();window.scrollTo(0,0)});if(page==='today')renderToday();if(page==='plan')renderPlan();if(page==='history')renderHistory();if(page==='profile')renderProfile();if(!storageOK)$('#view').insertAdjacentHTML('afterbegin','<p class="note warning">Хранилище недоступно или повреждено. Сделайте экспорт перед закрытием страницы. Старые данные не перезаписываются до вашего действия.</p>');if(state.active)$('#view').insertAdjacentHTML('afterbegin','<div class="card row"><span>Есть незавершённая тренировка</span><button class="btn small" onclick="renderWorkout()">Продолжить</button></div>')}

function renderToday(){let p=state.profile,s=currentSession(),done=state.history.length,recs=Object.entries(state.rules).filter(([id,r])=>r.reason).slice(-2);let now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()+6)%7);let week=Array.from({length:7},(_,i)=>{let d=new Date(mon);d.setDate(mon.getDate()+i);let key=dateKey(d);return`<div class="day ${state.plan.sessions.some(s=>s.date===key&&s.status==='planned')?'planned':''} ${state.history.some(h=>h.date===key)?'done':''} ${key===dateKey()?'today':''}">${dayNames[i]}<b>${d.getDate()}</b></div>`}).join('');$('#view').innerHTML=heading('ТВОЯ ПРАКТИКА',`${esc(p.name)}, держим ритм`,new Date().toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'}))+`<div class="stats"><div class="stat"><strong>${done}<span style="font-size:15px"> / ${state.plan.sessions.length}</span></strong><span>занятий завершено*</span></div><div class="stat"><strong>${p.frequency}</strong><span>тренировок в неделю</span></div><div class="stat"><strong>${p.duration}<span style="font-size:14px"> мин</span></strong><span>в твоём расписании</span></div></div><div class="grid"><div><div class="card hero"><div><span class="eyebrow">${s?'СЛЕДУЮЩАЯ ТРЕНИРОВКА · '+dateRu(s.date):'ЦИКЛ ЗАВЕРШЁН'}</span><h2>${s?esc(s.name):'Время нового плана'}</h2><p class="muted">${s?`${s.exercises.length} упражнения · ≈ ${p.duration} минут · запас 2–3 повтора`:'Сохраните привычку и начните следующие четыре недели.'}</p></div><div class="space"><button class="btn dark" onclick="${s?'preflight()':'regenerate()'}">${s?'Начать тренировку ↗':'Создать новый цикл ↗'}</button></div></div><div class="card"><div class="row"><h3>Твоя неделя</h3><span class="badge">${goals[p.goal]}</span></div><div class="week">${week}</div><small>Зелёный — запланировано, светлый — выполнено. Пропуски не снижают рабочие веса.</small></div></div><div><div class="card"><div class="eyebrow">МАЛЕНЬКИМИ ШАГАМИ</div><h2 style="margin-top:10px">Прогресс без спешки</h2><p class="muted">Сначала повторения. Потом вес. Техника и восстановление — на первом месте.</p><svg viewBox="0 0 260 80" aria-hidden="true"><path d="M0 65H52V52H104V38H156V25H208V8H260" fill="none" stroke="#d2f779" stroke-width="3"/><path d="M0 76H260" stroke="#354030"/></svg><small>Схема принципа прогрессии, не прогноз результатов.</small><div class="note">${esc(state.plan.reason)}</div></div>${recs.length?recs.map(([id,r])=>`<div class="card"><span class="eyebrow">СЛЕДУЮЩИЙ ШАГ</span><h3 style="margin-top:8px">${esc(DB.find(e=>e.id===id)?.name)}</h3><p class="muted">${esc(r.reason)}</p></div>`).join(''):`<div class="card"><span class="badge">Первая тренировка</span><h3 style="margin-top:12px">Начни с комфортного</h3><p class="muted">Не знаешь рабочий вес? Выполни лёгкие пробные подходы и подбери нагрузку с запасом 3–4 повтора.</p></div>`}</div></div><small>* Завершённые занятия за всё время. Размер текущего цикла — ${state.plan.sessions.length} занятий.</small>`}
function exerciseHTML(x,i,editable=true){let ex=resolved(x),e=DB.find(e=>e.id===x.id),r=state.rules[x.id];return `<div class="exercise"><div class="row"><span class="number">${String(i+1).padStart(2,'0')}</span><div class="grow"><h3>${esc(e.name)}</h3><small>${ex.sets} × ${ex.low}–${ex.high} · ${e.body?'свой вес / сопротивление':ex.confirmed?displayWeight(ex.weight)+' '+unit():'подбор веса'} · RIR ${ex.rir} · ${ex.rest} с</small></div>${editable?`<button class="btn secondary small" aria-label="Настроить ${esc(e.name)}" onclick="editExercise('${x.id}')">···</button>`:''}</div>${!ex.confirmed?'<p class="calibration">Калибровка: подбери лёгкую комфортную нагрузку</p>':''}${r?.blocked?'<p class="note warning">Автоповышение заблокировано: отмечалась боль.</p>':''}</div>`}
function renderPlan(){let sessions=state.plan.sessions.filter(s=>s.week===weekTab);$('#view').innerHTML=heading('ЧЕТЫРЕ НЕДЕЛИ','План, который подстраивается','Будущая нагрузка обновляется только после фактических тренировок.')+`<div class="tabs">${[0,1,2,3].map(i=>`<button class="${i===weekTab?'active':''}" onclick="weekTab=${i};renderPlan()">Неделя ${i+1}</button>`).join('')}</div><p class="note">${esc(state.plan.reason)} Разминка включена во время занятия. При выбранных ограничениях некоторые группы движений могут быть исключены.</p><div class="space">${sessions.map(s=>`<div class="card"><div class="row"><div><span class="eyebrow">${dateRu(s.date)}</span><h2 style="margin-top:6px">${esc(s.name)}</h2></div><span class="badge">${s.status==='done'?'Завершена':s.status==='skipped'?'Пропущена':'В плане'}</span></div>${s.status==='done'?'<p class="muted">Фактические подходы и веса сохранены в «Прогрессе».</p>':s.exercises.map((x,i)=>exerciseHTML(x,i,s.status==='planned')).join('')}${!s.exercises.length?'<p class="note warning">Нет подходящих упражнений. Проверьте оборудование и ограничения в профиле.</p>':''}${s.status==='planned'?`<div class="row space wrap"><button class="btn small" onclick="preflight('${s.id}')">Начать</button><button class="link" onclick="skipSession('${s.id}')">Пропустить</button></div>`:''}</div>`).join('')}</div><button class="btn secondary" onclick="regenerate()">Пересоздать план</button>`}

function editExercise(id){let sample=state.plan.sessions.flatMap(s=>s.exercises).find(e=>e.id===id);if(!sample)return;let ex=resolved(sample),pool=allowed(state.profile).filter(e=>e.group===DB.find(e=>e.id===id).group);modal(`<h2>Настройка упражнения</h2><p class="muted">Изменения применятся к будущим занятиям с этим упражнением. История останется прежней.</p><form id="edit-form"><label>Упражнение / замена той же группы</label><select id="replace">${pool.map(e=>`<option value="${e.id}" ${e.id===id?'selected':''}>${e.name}</option>`).join('')}</select><div class="fields"><div><label>Подходы</label><input id="e-sets" type="number" min="1" max="5" required value="${ex.sets}"></div><div><label>Вес, ${unit()}</label><input id="e-weight" type="number" min="0" max="2000" step="0.01" required value="${displayWeight(ex.weight)}"></div><div><label>Повторы от</label><input id="e-low" type="number" min="1" max="30" required value="${ex.low}"></div><div><label>Повторы до</label><input id="e-high" type="number" min="1" max="30" required value="${ex.high}"></div><div><label>Отдых, с</label><input id="e-rest" type="number" min="30" max="600" required value="${ex.rest}"></div><div><label>Ориентир RIR</label><input id="e-rir" type="number" min="2" max="5" required value="${ex.rir}"></div></div><label class="check space"><input id="unblock" type="checkbox"> Снять блокировку после боли (проблема решена)</label><p class="note">Смена вариации обнуляет сравнение: нагрузку новой вариации подберите заново.</p><div class="row space"><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn">Сохранить</button></div></form>`);$('#edit-form').onsubmit=e=>{e.preventDefault();let low=+$('#e-low').value,high=+$('#e-high').value;if(high<low){toast('Верхняя граница должна быть не меньше нижней.');return}let newId=$('#replace').value,changed=newId!==id,newEx=changed?makeExercise(DB.find(e=>e.id===newId),state.profile):{...ex,sets:+$('#e-sets').value,weight:fromWeight($('#e-weight').value),low,high,rest:+$('#e-rest').value,rir:+$('#e-rir').value,confirmed:true};state.plan.sessions.filter(s=>s.status==='planned').forEach(s=>{s.exercises=s.exercises.map(x=>x.id===id?clone(newEx):x)});if(!changed)state.rules[id]={...state.rules[id],weight:newEx.weight,sets:newEx.sets,nextLow:low,nextHigh:high,confirmed:true,streak:0,blocked:$('#unblock').checked?false:state.rules[id]?.blocked||false,reason:'Параметры изменены вручную. Следующая рекомендация будет рассчитана по новым результатам.'};persist();closeModal();render()}}

<script>

function checkList(obj,selected,name){return `<div class="checks">${Object.entries(obj).map(([v,t])=>`<label class="check"><input type="checkbox" name="${name}" value="${v}" ${selected.includes(v)?'checked':''}>${t}</label>`).join('')}</div>`}
function formSection(i,p){if(i===0)return `<div class="form-block"><h3>Познакомимся</h3><label for="p-name">Имя</label><input id="p-name" name="name" maxlength="40" required autocomplete="given-name" value="${esc(p.name)}"><div class="fields"><div><label for="p-age">Возраст, лет</label><input id="p-age" name="age" type="number" required min="18" max="100" value="${p.age}"></div><div><label for="p-height">Рост, см</label><input id="p-height" name="height" type="number" required min="100" max="250" value="${p.height}"></div><div><label for="p-weight">Вес тела, кг</label><input id="p-weight" name="weight" type="number" required min="30" max="350" step="0.1" value="${p.weight}"></div><div><label for="p-unit">Рабочие веса</label><select id="p-unit" name="unit">${options({kg:'Килограммы',lb:'Фунты'},p.unit)}</select></div></div><small>Рост и вес тела хранятся в метрической системе. Программа рассчитана на взрослых.</small></div><div class="form-block"><h3>К чему идём</h3><label for="p-goal">Цель</label><select id="p-goal" name="goal">${options(goals,p.goal)}</select><label for="p-level">Опыт</label><select id="p-level" name="level">${options(levels,p.level)}</select></div>`;
if(i===1)return `<div class="form-block"><h3>Место для тренировки в твоей неделе</h3><div class="fields"><div><label for="p-frequency">Занятий в неделю</label><select id="p-frequency" name="frequency">${options({1:'1 занятие',2:'2 занятия',3:'3 занятия',4:'4 занятия',5:'5 занятий',6:'6 занятий'},p.frequency)}</select></div><div><label for="p-duration">Время, минут</label><select id="p-duration" name="duration">${options({20:20,30:30,45:45,60:60,75:75,90:90},p.duration)}</select></div></div><label>Предпочтительные дни (по числу занятий)</label>${checkList(Object.fromEntries(dayNames.map((x,i)=>[i,x])),p.days.map(String),'days')}<p class="note">Старайтесь оставлять день отдыха между тренировками всего тела. При 5–6 занятиях дополнительные тренировки облегчены.</p></div><div class="form-block"><label for="p-place">Где занимаешься</label><select id="p-place" name="place">${options({home:'Дома',gym:'В зале'},p.place)}</select><label>Доступное оборудование</label>${checkList(equipNames,p.equipment,'equipment')}<small>Для штанги подразумеваются стойки и страховочные упоры. Отмечайте только реально доступное оборудование.</small></div>`;
return `<div class="form-block"><h3>Комфортная нагрузка</h3><label>Ограничения движений</label>${checkList(limitNames,p.limits,'limits')}<label for="p-notes">Травмы, ограничения и заметки</label><textarea id="p-notes" name="notes" maxlength="2000" placeholder="Например: ограничение после травмы плеча">${esc(p.notes)}</textarea><p class="note">Свободный текст сохраняется как заметка и не интерпретируется алгоритмом. Отметьте категории выше и исключите конкретные упражнения ниже. При травме согласуйте допустимые движения со специалистом.</p><details><summary>Исключить конкретные упражнения</summary>${checkList(Object.fromEntries(DB.map(e=>[e.id,e.name])),p.exclusions,'exclusions')}</details></div><div class="form-block"><h3>Известные рабочие веса · ${p.unit==='lb'?'фунт.':'кг'}</h3><p class="muted">Необязательно. Указывайте комфортный вес, а не максимум. Для гантелей — вес одной, кроме гоблет-приседа и моста; для штанги — вместе с грифом.</p>${DB.filter(e=>!e.body&&e.eq.every(q=>p.equipment.includes(q))).map(e=>`<label for="known-${e.id}">${e.name}</label><input id="known-${e.id}" name="known-${e.id}" type="number" min="0" max="2000" step="0.01" placeholder="Подобрать на тренировке" value="${p.known[e.id]?+(p.known[e.id]*(p.unit==='lb'?2.2046226218:1)).toFixed(2):''}">`).join('')}<p class="note">Если вес неизвестен, начнём с калибровки. Оставляйте 3–4 повтора в запасе. Собственный вес и резинка записываются с внешним весом 0.</p></div><div class="form-block"><h3>Шаг увеличения веса · ${p.unit==='lb'?'фунт.':'кг'}</h3><div class="fields">${Object.entries({dumbbell:'Гантель (на одну)',barbell:'Штанга (общий)',cable:'Блочный тренажёр'}).map(([k,t])=>`<div><label for="step-${k}">${t}</label><input id="step-${k}" name="step-${k}" type="number" min="0.1" max="50" step="0.1" required value="${+(p.steps[k]*(p.unit==='lb'?2.2046226218:1)).toFixed(1)}"></div>`).join('')}</div></div>`}
function collectForm(f,p,sections){let data=new FormData(f),q=clone(p);if(sections.includes(0)){for(let k of ['name','goal','level','unit'])q[k]=String(data.get(k)||'').trim();for(let k of ['age','height','weight'])q[k]=num(data.get(k))}if(sections.includes(1)){for(let k of ['frequency','duration'])q[k]=num(data.get(k));q.place=data.get('place');q.days=data.getAll('days').map(Number);q.equipment=[...new Set(['body',...data.getAll('equipment')])];if(q.days.length!==q.frequency)throw Error(`Выберите ровно ${q.frequency} дня занятий.`)}if(sections.includes(2)){q.limits=data.getAll('limits');q.exclusions=data.getAll('exclusions');q.notes=String(data.get('notes')||'');const fct=p.unit==='lb'?2.2046226218:1;DB.filter(e=>data.has('known-'+e.id)).forEach(e=>q.known[e.id]=num(data.get('known-'+e.id))/fct);Object.keys(q.steps).forEach(k=>q.steps[k]=num(data.get('step-'+k))/fct)}if(!q.name&&sections.includes(0))throw Error('Введите имя.');return q}
function renderOnboarding(){if(!draft)draft=defaults();const titles=['Начнём с тебя','Выберем твой ритм','Сделаем план твоим'];$('#app').innerHTML=`<main class="onboard"><div class="brand"><span class="logo"><i></i><i></i><i></i></span>ритм<span style="color:var(--lime)">.</span></div><span class="eyebrow">ТВОЙ СТАРТ · ШАГ ${onStep+1} ИЗ 3</span><h1 style="margin-top:12px">${titles[onStep]}</h1><p class="muted">Немного о тебе — и четыре недели понятной практики.</p><div class="progress"><i style="width:${(onStep+1)/3*100}%"></i></div>${recoveryError?'<p class="note warning">Сохранённые данные не удалось прочитать. Экспортируйте их перед созданием нового профиля.</p><button class="link" onclick="exportRaw()">Скачать исходное хранилище</button>':''}<form id="onboarding" class="card">${formSection(onStep,draft)}<div class="actions">${onStep?'<button type="button" class="btn secondary" id="back">Назад</button>':''}<button class="btn" type="submit">${onStep===2?'Создать мой план ↗':'Далее →'}</button></div></form><small>Без регистрации и отправки данных. Профиль хранится только в этом браузере.</small><div><button class="link" onclick="importBackup()">Восстановить из резервной копии</button></div></main>`;$('#onboarding').onsubmit=e=>{e.preventDefault();try{draft=collectForm(e.target,draft,[onStep]);if(onStep<2){onStep++;renderOnboarding();window.scrollTo(0,0)}else{if(recoveryError&&!confirm('Новый профиль заменит старое нечитаемое хранилище. Продолжить?'))return;state.profile=clone(draft);state.plan=makePlan(draft);recoveryError=false;persist();render()}}catch(err){toast(err.message)}};if($('#back'))$('#back').onclick=()=>{onStep--;renderOnboarding()}}
function renderProfile(){let p=state.profile;$('#view').innerHTML=heading('ВСЁ ПОД ТЕБЯ','Твой профиль','Данные остаются на этом устройстве.')+`<form id="profile-form" class="card">${[0,1,2].map(i=>formSection(i,p)).join('')}<p class="note">При изменении единиц измерения сначала сохраните профиль; значения весов на этой форме указаны в текущих единицах. Для нового расписания пересоздайте план отдельно.</p><button class="btn full">Сохранить профиль</button></form><div class="card"><h3>План и данные</h3><div class="backup space"><button class="btn secondary small" onclick="regenerate()">Пересоздать план</button><button class="btn secondary small" onclick="exportBackup()">Экспорт JSON</button><button class="btn secondary small" onclick="importBackup()">Импорт JSON</button></div><p class="muted">Экспортируйте резервную копию: очистка данных Safari и смена адреса сайта могут сделать историю недоступной.</p><button class="link" onclick="installHelp()">Как установить на iPhone ↗</button><div><button class="link" style="color:var(--danger)" onclick="resetData()">Удалить все данные</button></div></div>`;$('#profile-form').onsubmit=e=>{e.preventDefault();try{if(state.active){toast('Завершите или отмените тренировку перед изменением профиля.');return}const next=collectForm(e.target,p,[0,1,2]);state.profile=next;persist();render();toast('Профиль сохранён. История и текущий план сохранены.');confirmAction('Обновить план по профилю?','Создадим новый четырёхнедельный план с новым оборудованием и ограничениями. Завершённая история и рабочие рекомендации сохранятся.',()=>{state.plan=makePlan(next);weekTab=0;persist();render()})}catch(err){toast(err.message)}}}
function preflight(id){if(state.active){renderWorkout();return}let s=id?state.plan.sessions.find(x=>x.id===id):currentSession();if(!s||s.status!=='planned')return;if(!s.exercises.length){toast('В плане нет доступных упражнений. Измените профиль.');return}let noLongerAllowed=s.exercises.some(x=>!allowed(state.profile).some(e=>e.id===x.id));if(noLongerAllowed){toast('План противоречит текущим ограничениям или оборудованию. Пересоздайте его в профиле.');return}modal(`<h2>Как ты сегодня?</h2><p class="muted">Это поможет выбрать комфортный объём. Можно перенести тренировку без штрафа.</p><form id="readiness"><label for="energy">Энергия</label><select id="energy"><option value="3">Хорошая</option><option value="2">Обычная</option><option value="1">Низкая</option></select><label for="sleep">Сон за ночь, часов</label><input id="sleep" type="number" min="0" max="16" step="0.5" value="7" required><label for="stress">Стресс</label><select id="stress"><option value="1">Низкий</option><option value="2">Умеренный</option><option value="3">Высокий</option></select><label class="check space"><input type="checkbox" id="pain-today"> Есть боль, болезнь или выраженное недомогание</label><p class="note">При сне менее 6 часов, низкой энергии или высоком стрессе предложим убрать один рабочий подход, сохранить вес и запас 3–4 повтора. Такая тренировка не повышает и не снижает будущую нагрузку.</p><div class="row space"><button type="button" class="btn secondary" onclick="closeModal()">Отложить</button><button class="btn">Продолжить</button></div></form>`);$('#readiness').onsubmit=e=>{e.preventDefault();if($('#pain-today').checked){modal('<h2>Сегодня — восстановление</h2><p class="note warning">При боли, болезни или выраженном недомогании силовую тренировку лучше отложить. Прекратите болезненные движения. При сохраняющейся или сильной боли обратитесь за медицинской помощью.</p><button class="btn full space" onclick="closeModal()">Понятно</button>');return}let readiness={energy:+$('#energy').value,sleep:+$('#sleep').value,stress:+$('#stress').value},light=readiness.energy===1||readiness.sleep<6||readiness.stress===3;state.active={id:uid(),sessionId:s.id,name:s.name,started:Date.now(),date:dateKey(),readiness,light,exercises:s.exercises.map(x=>{let ex=resolved(x);if(light){ex.sets=Math.max(1,ex.sets-1);ex.rir=4}return{...ex,logs:Array.from({length:ex.sets},()=>({weight:DB.find(e=>e.id===x.id).body?0:'',reps:'',rir:'',pain:false,technique:false}))}})};persist();closeModal();renderWorkout()}}
function renderWorkout(){let a=state.active;if(!a)return;closeModal();page='today';render();$('#view').innerHTML=heading(a.light?'ОБЛЕГЧЁННАЯ ПРАКТИКА':'ТВОЯ ТРЕНИРОВКА',esc(a.name),'RIR — сколько чистых повторов осталось в запасе. RIR 2 = мог бы сделать ещё два.')+`<div class="card"><span class="eyebrow">01 / РАЗМИНКА · 5–7 МИНУТ</span><p>Лёгкая ходьба на месте, мягкие движения суставами и пробные повторения без нагрузки. Не растягивайтесь через боль.</p><label class="check space"><input type="checkbox" id="warm-done" ${a.warm?'checked':''}> Общая разминка выполнена</label><p class="note">Перед каждым упражнением: 1–2 лёгких разминочных подхода по 6–10 повторов с запасом ≥ 5. Для известного веса ориентир 40–60%, затем 60–75%. Для собственного веса — облегчённая вариация. Они не входят в рабочие подходы и не влияют на прогрессию.</p></div>${a.light?'<p class="note">Самочувствие: объём уменьшен. Обычная нагрузка останется прежней; данные этой тренировки сохранятся отдельно.</p>':''}${a.exercises.map((ex,i)=>{let e=DB.find(e=>e.id===ex.id);return`<section class="card"><div class="row"><span class="number">${i+1}</span><h2 class="grow" style="font-size:21px">${e.name}</h2></div><p class="muted">${ex.sets} × ${ex.low}–${ex.high} · ориентир RIR ${ex.rir} · отдых ${ex.rest} с</p><p class="note">${e.tip}</p>${!ex.confirmed?'<p class="note">Калибровка: выберите лёгкий вес, сделайте пробный подход. Рабочий вес комфортен, если техника стабильна и остаётся 3–4 повтора. Не тестируйте максимум.</p>':''}${state.rules[ex.id]?.blocked?'<p class="note warning">По этому движению отмечалась боль. Автоповышение заблокировано; выберите безболезненный вариант до продолжения.</p>':''}<small>${e.body?'Внешний вес 0. Для резинки сохраняйте одну и ту же резинку и натяжение.':`Ориентир: ${ex.confirmed?displayWeight(ex.weight)+' '+unit():'ручной подбор'}. Введите фактически выполненный вес.`}</small><div class="set-row space"><span></span><span class="set-label">Вес, ${unit()}</span><span clas ие заблокировано. Прекратите болезненное движение.'};persist();toast('Прекратите болезненное движение. Оставшиеся подходы можно не выполнять.')}}));updateTimer()}
function startTimer(seconds){timerEnd=Date.now()+seconds*1000;clearInterval(timerTick);timerTick=setInterval(updateTimer,500);updateTimer()}
function updateTimer(){const box=$('#timer-box');if(!box)return;if(!timerEnd){box.innerHTML='';return}let left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));box.innerHTML=`<div class="timer"><span>◷ Отдых</span><strong role="timer">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</strong><small style="color:#304223">${left?'Дыши спокойно':'Можно продолжать'}</small><button aria-label="Закрыть таймер" onclick="timerEnd=0;clearInterval(timerTick);updateTimer()">×</button></div>`;if(!left)clearInterval(timerTick)}
function cancelWorkout(){confirmAction('Отменить тренировку?','Черновик будет удалён. План и история останутся прежними. Отметки боли сохранят блокировку повышения.',()=>{state.active=null;timerEnd=0;clearInterval(timerTick);persist();render()})}
function finishWorkout(){let a=state.active;if(!a)return;const inputs=[...document.querySelectorAll('[data-log]')];if(inputs.some(i=>!i.checkValidity())){toast('Проверьте значения: вес 0–2000, целые повторы 0–100, RIR 0–10.');return}if(!a.warm&&!confirm('Общая разминка не отмечена. Сохранить тренировку?'))return;let missing=a.exercises.some(e=>e.logs.some(s=>s.weight===''||s.reps===''||s.rir===''));if(missing&&!confirm('Есть незаполненные подходы. Сохранить как частично выполненную тренировку? Для этих упражнений повышение не рассчитывается.'))return;let meaningful=a.exercises.some(e=>e.logs.some(s=>s.reps!==''||s.pain));if(!meaningful){toast('Введите хотя бы один результат или отмените тренировку.');return}let recommendations=[];for(let ex of a.exercises){let r;if(a.light&&!ex.logs.some(s=>s.pain)){r={...state.rules[ex.id],reason:'Облегчённая тренировка по самочувствию. Обычная нагрузка и счётчик неудачных попыток сохранены.'};recommendations.push({id:ex.id,reason:r.reason});continue}r=progression(ex,ex.logs,state.rules[ex.id]);state.rules[ex.id]=r;recommendations.push({id:ex.id,...clone(r)})}state.history.push({...clone(a),finished:Date.now(),recommendations});const s=state.plan.sessions.find(s=>s.id===a.sessionId);if(s)s.status='done';state.active=null;timerEnd=0;clearInterval(timerTick);persist();render();modal(`<span class="eyebrow">ПРАКТИКА ЗАСЧИТАНА</span><h2 style="margin-top:10px">Ещё один шаг вперёд</h2><p class="muted">Результаты сохранены. Это предложения для следующей тренировки — их можно изменить в плане.</p>${recommendations.map(r=>`<div class="exercise"><h3>${DB.find(e=>e.id===r.id).name}</h3><p class="muted">${esc(r.reason)}</p></div>`).join('')}<button class="btn full space" onclick="closeModal()">Готово</button>`)}
function renderHistory(){let h=state.history.slice().reverse();$('#view').innerHTML=heading('ТВОЯ ПОСЛЕДОВАТЕЛЬНОСТЬ','Прогресс','Только фактические результаты. Каждое движение — отдельная история.')+`<div class="stats"><div class="stat"><strong>${h.length}</strong><span>тренировок</span></div><div class="stat"><strong>${h.reduce((n,a)=>n+a.exercises.reduce((m,e)=>m+e.logs.filter(s=>s.reps!=='').length,0),0)}</strong><span>записанных подходов</span></div><div class="stat"><strong>${Math.round(h.reduce((n,a)=>n+(a.finished-a.started)/60000,0))}</strong><span>минут с таймером*</span></div></div><div class="card"><h3>Динамика одного упражнения</h3><label for="history-ex">Упражнение</label><select id="history-ex"><option value="">Выберите упражнение</option>${DB.filter(e=>h.some(a=>a.exercises.some(x=>x.id===e.id))).map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select><div id="history-chart" class="empty">После тренировки здесь появятся фактические подходы.</div></div><div class="card"><div class="row"><h2>Дневник</h2><span class="badge">${h.length} записей</span></div>${h.length?h.map(a=>`<div class="history-item"><div class="row"><div><h3>${esc(a.name)}</h3><small>${dateRu(a.date)} · ${a.light?'облегчённая · ':''}${a.exercises.length} упражнений</small></div><button class="btn secondary small" onclick="historyDetail('${a.id}')">Открыть ↗</button></div></div>`).join(''):'<div class="empty">Здесь пока чистый лист.<br>Первая тренировка станет точкой отсчёта.</div>'}</div><small>* Время между стартом и завершением, включая паузы. Не оценка активности или расхода калорий.</small>`;$('#history-ex').onchange=e=>renderChart(e.target.value)}
function renderChart(id){if(!id){$('#history-chart').innerHTML='Выберите упражнение.';return}let body=DB.find(e=>e.id===id).body;let data=state.history.filter(a=>a.exercises.some(e=>e.id===id)).slice(-8).map(a=>{let ex=a.exercises.find(e=>e.id===id);let logs=ex.logs.filter(s=>s.reps!==''&&s.weight!=='');return{date:a.date,value:logs.length?Math.max(...logs.map(s=>body?+s.reps:displayWeight(s.weight))):0,logs}});let max=Math.max(1,...data.map(d=>d.value));$('#history-chart').className='';$('#history-chart').innerHTML=`<p class="muted">${body?'Максимум повторений в одном подходе':'Максимальный записанный рабочий вес, '+unit()}. Сравнивайте также повторы, технику и RIR.</p><div class="chart" style="margin-bottom:36px">${data.map(d=>`<div class="bar" style="height:${Math.max(4,d.value/max*100)}%" title="${dateRu(d.date)}: ${d.value}"><span>${d.date.slice(5).split('-').reverse().join('.')}<br>${d.value}</span></div>`).join('')}</div><small>Каждый столбец — завершённая тренировка. Без сравнения с другими вариациями.</small>`}
function historyDetail(id){let a=state.history.find(a=>a.id===id);modal(`<span class="eyebrow">${dateRu(a.date)}</span><h2 style="margin-top:8px">${esc(a.name)}</h2><small>Сон ${a.readiness.sleep} ч · энергия ${a.readiness.energy}/3 · стресс ${a.readiness.stress}/3</small>${a.exercises.map(ex=>`<div class="exercise"><h3>${DB.find(e=>e.id===ex.id).name}</h3>${ex.logs.map((s,i)=>`<p class="muted">${i+1}. ${s.weight===''?'—':displayWeight(s.weight)} ${unit()} × ${s.reps===''?'—':s.reps} · RIR ${s.rir===''?'—':s.rir}${s.pain?' · боль':''}${s.technique?' · сбой техники':''}</p>`).join('')}<p class="note">${esc(a.recommendations.find(r=>r.id===ex.id)?.reason||'')}</p></div>`).join('')}<button class="btn full space" onclick="closeModal()">Закрыть</button>`)}
function downloadText(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportBackup(){downloadText(JSON.stringify(state,null,2),'ritm-backup-'+dateKey()+'.json');toast('Резервная копия подготовлена. Сохраните файл в «Файлы».')}
function exportRaw(){try{downloadText(localStorage.getItem(KEY)||'{}','ritm-original.json')}catch(e){toast('Не удаётся прочитать хранилище.')}}
function validBackup(x){
const finite=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;
const id=v=>typeof v==='string'&&/^[a-z0-9]+$/.test(v);
const date=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v)&&!isNaN(parseDate(v));
const knownId=v=>DB.some(e=>e.id===v);
const list=(a,fn)=>Array.isArray(a)&&a.length<=10000&&a.every(fn);
const check=e=>e&&knownId(e.id)&&Number.isInteger(e.sets)&&finite(e.sets,1,5)&&Number.isInteger(e.low)&&Number.isInteger(e.high)&&finite(e.low,1,30)&&finite(e.high,e.low,30)&&finite(e.weight,0,2000)&&finite(e.rest,30,600)&&finite(e.rir,2,5)&&typeof e.confirmed==='boolean';
const log=s=>s&&['weight','reps','rir'].every(k=>s[k]===''||finite(s[k],0,k==='weight'?2000:k==='reps'?100:10))&&typeof s.pain==='boolean'&&typeof s.technique==='boolean';
const workout=a=>a&&id(a.id)&&id(a.sessionId)&&typeof a.name==='string'&&a.name.length<=100&&date(a.date)&&finite(a.started,0,1e14)&&a.readiness&&finite(a.readiness.sleep,0,16)&&finite(a.readiness.energy,1,3)&&finite(a.readiness.stress,1,3)&&list(a.exercises,e=>check(e)&&list(e.logs,log)&&e.logs.length===e.sets);
if(!x||x.version!==1||!x.profile||!x.plan||!x.rules||typeof x.rules!=='object')return false;
let p=x.profile;
if(typeof p.name!=='string'||p.name.length>40||!finite(p.age,18,100)||!finite(p.height,100,250)||!finite(p.weight,30,350)||!goals[p.goal]||!levels[p.level]||!['kg','lb'].includes(p.unit)||!['home','gym'].includes(p.place)||!Number.isInteger(p.frequency)||!finite(p.frequency,1,6)||!finite(p.duration,20,90)||!list(p.equipment,k=>Object.hasOwn(equipNames,k))||!list(p.limits,k=>Object.hasOwn(limitNames,k))||!list(p.exclusions,knownId)||!list(p.days,v=>Number.isInteger(v)&&finite(v,0,6))||p.days.length!==p.frequency||new Set(p.days).size!==p.days.length||typeof p.notes!=='string'||p.notes.length>2000||!p.known||!p.steps)return false;
if(!Object.entries(p.known).every(([k,v])=>knownId(k)&&finite(v,0,2000))||!['dumbbell','barbell','cable'].every(k=>finite(p.steps[k],0.01,50)))return false;
if(!id(x.plan.id)||!date(x.plan.created)||typeof x.plan.reason!=='string'||!list(x.plan.sessions,s=>id(s.id)&&date(s.date)&&typeof s.name==='string'&&s.name.length<=100&&Number.isInteger(s.week)&&finite(s.week,0,3)&&['planned','done','skipped'].includes(s.status)&&list(s.exercises,check)))return false;
if(!Object.entries(x.rules).every(([k,r])=>knownId(k)&&r&&finite(r.weight,0,2000)&&(r.sets===undefined||finite(r.sets,1,5))&&(r.nextLow===undefined||finite(r.nextLow,1,30))&&(r.nextHigh===undefined||finite(r.nextHigh,1,30))&&typeof r.reason==='string'))return false;
return list(x.history,a=>workout(a)&&finite(a.finished,a.started,1e14)&&list(a.recommendations,r=>knownId(r.id)&&typeof r.reason==='string'))&&(!x.active||workout(x.active));
}
function importBackup(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let f=input.files[0];if(!f)return;try{if(f.size>10000000)throw Error('Файл больше 10 МБ.');let x=JSON.parse(await f.text());if(!validBackup(x))throw Error('Формат копии не поддерживается или данные повреждены.');confirmAction('Восстановить резервную копию?','Профиль, план и история на этом устройстве будут заменены данными файла. Перед заменой рекомендуется экспорт текущих данных.',()=>{state=clone(x);draft=null;recoveryError=false;persist();closeModal();render();toast('Данные восстановлены.')})}catch(e){toast(e.message||'Не удалось прочитать файл.')}};input.click()}
function resetData(){confirmAction('Удалить все данные?','Профиль, план, история и незавершённая тренировка будут удалены с этого устройства. Отменить удаление нельзя.',()=>{state={version:1,profile:null,plan:null,history:[],rules:{},active:null};try{localStorage.removeItem(KEY)}catch(e){}draft=null;onStep=0;closeModal();render()})}
function installHelp(){modal('<h2>Ритм на экране «Домой»</h2><p>Откройте адрес приложения с HTTPS в Safari. Нажмите «Поделиться» → «На экран Домой» → «Добавить».</p><p class="muted">После первого успешного открытия на HTTPS приложение сохраняет оболочку для офлайн-запуска. Дождитесь сообщения «Офлайн готов». Откройте установленную версию один раз с интернетом.</p><p class="note">При открытии index.html как файла интерфейс работает без PWA. Service worker требует HTTPS либо localhost на том же устройстве. Не очищайте данные Safari без резервной копии.</p><button class="btn full space" onclick="closeModal()">Понятно</button>')}
readStorage();render();
if('serviceWorker'in navigator&&['https:','http:'].includes(location.protocol)){navigator.serviceWorker.register('./service-worker.js').then(()=>navigator.serviceWorker.ready).then(()=>{toast('Офлайн готов. Приложение можно добавить на экран «Домой».');let el=$('#offline-status');if(el)el.textContent='Офлайн готов'}).catch(()=>{let el=$('#offline-status');if(el)el.textContent='Веб-версия';console.info('Офлайн-кэш недоступен; приложение работает как веб-страница.')})}
</script>
</body></html>
